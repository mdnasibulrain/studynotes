<style id="snp-css">

.snp-logo.img .snp-img{display:block}.snp-logo.img .snp-mark,.snp-logo.img .snp-sn{display:none}
@keyframes snpImg{to{opacity:1;transform:none}}
.snp-mark{fill:none;stroke-linecap:round;stroke-linejoin:round}
.snp-mark .d{stroke-dasharray:1;stroke-dashoffset:1;animation:snpDraw var(--t) cubic-bezier(.6,0,.3,1) calc(var(--d)*var(--k)) forwards}
.snp-mark .br{stroke:var(--a);stroke-width:2.5;opacity:.75;--t:calc(.5s*var(--k));--d:.05s}

.snp-mark .dc{stroke:var(--ink);stroke-width:3;--t:calc(.7s*var(--k));--d:.9s}

.snp-tag{margin-top:16px;font-weight:700;font-size:clamp(10px,3.1vw,13.5px);letter-spacing:.3em;text-transform:uppercase;color:var(--ink)}

.snp-bar{width:min(46vw,170px);height:4px;margin-top:26px;border-radius:4px;background:var(--bg2);overflow:hidden;opacity:0}

.snp-bar.run b{animation:snpBar var(--bd,3s) linear forwards}

  regularPrice: item.regularPrice, todayPrice: item.salePrice, comboOff: 0
});
/* पुरानो Cart लाई हालको catalog (नयाँ price) सँग मिलाउने; हराएको item हटाउने */
function refreshItem(it) {
  if (!it || !Array.isArray(it.ebookIds) || !it.ebookIds.length) return null;
  if (it.kind === "ebook") { const p = PBYID[it.id]; return p ? toCartItem(p) : null; }
  if (it.kind === "bundle") { const b = BYID[it.id]; return b && b.kind === "bundle" ? toCartItem(b) : null; }
  if (it.kind === "combo") {
    if (!COMBO_ON || !it.ebookIds.every(id => PBYID[id])) return null;
    const ps = it.ebookIds.map(id => PBYID[id]);
    const regular = sum(ps, p => p.regularPrice), today = sum(ps, p => p.salePrice);
    if (ps.length < COMBO_MIN) return null;
    return { ...it, regularPrice: regular, todayPrice: today, comboOff: Math.round(today * COMBO_PERCENT / 100) };
  }
  return null;
}

// Price हिसाब: Regular → Today Discount → Today Price → Combo Discount → Final Amount
function calcTotals(list) {
  const regular = sum(list, i => i.regularPrice);
  const today = sum(list, i => i.todayPrice);
  const singles = list.filter(i => i.kind === "ebook");
  const singlesToday = sum(singles, i => i.todayPrice);
  const singlesCombo = COMBO_ON && singles.length >= COMBO_MIN ? Math.round(singlesToday * COMBO_PERCENT / 100) : 0;
  const comboDiscount = singlesCombo + sum(list, i => i.comboOff || 0);
  return {
    regular, today, todayDiscount: regular - today, comboDiscount,
    final: today - comboDiscount, saved: regular - (today - comboDiscount),
    count: list.length, ebookCount: sum(list, i => i.ebookIds.length), singlesCount: singles.length
  };

function useCountdown(endMs) {

  useEffect(() => { if (!endMs) return; setNow(Date.now()); const i = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(i); }, [endMs]);
  if (!endMs || endMs <= now) return null;
  return SN.formatCountdown(endMs - now);
}

function LibrarySection() {
  const A = useContext(Ctx);
  const { query, setQuery, sortBy, setSortBy } = A;
  const category = A.category !== "all" && !CAT[A.category] ? "all" : A.category;
  const setCategory = A.setCategory;
  const [sOpen, setSOpen] = useState(false);
  const lib = SITE.library;
  const list = useMemo(() => {
    const q = query.toLowerCase().trim();
    return PRODUCTS.filter(p => (category === "all" || p.category === category) && (!q || [p.title, p.subtitle, p.summary, p.id, ...p.tags].join(" ").toLowerCase().includes(q)))
      .sort((a, b) => {
        if (sortBy === "price-low") return a.salePrice - b.salePrice;
        if (sortBy === "price-high") return b.salePrice - a.salePrice;
        if (sortBy === "discount") return pct(b.regularPrice, b.salePrice) - pct(a.regularPrice, a.salePrice);
        if (sortBy === "popular") return (b.soldCopies || 0) - (a.soldCopies || 0);
        if (sortBy === "newest") return (b.isNew ? 1 : 0) - (a.isNew ? 1 : 0);
        return (b.isFeatured ? 1 : 0) - (a.isFeatured ? 1 : 0);
      });
  }, [category, query, sortBy, A.tick]);
  const activeName = category === "all" ? L("libAll") : CAT[category].name;
  const FBtn = ({ id, icon, label }) => {
    const on = category === id;
    return (
      <button onClick={() => setCategory(id)} title={label} aria-label={label} aria-pressed={on}
        className={`relative w-10 h-10 shrink-0 rounded-xl border flex items-center justify-center transition ${on ? "bg-orange-500 text-white border-orange-500 shadow-md shadow-orange-200 scale-105" : "bg-white text-slate-600 border-slate-200 hover:border-orange-300 hover:text-orange-600"}`}>
        <Icon name={icon} className="w-[18px] h-[18px]" />
        {on && <span className="absolute -bottom-1 w-1.5 h-1.5 rounded-full bg-orange-600 border border-white"></span>}
      </button>
    );
  };
  return (
    <section id="explore" className="py-10 bg-white border-b border-orange-100">
      <div className="max-w-7xl mx-auto px-3 md:px-4">
        <div className="flex items-end justify-between gap-3 mb-4">
          <div>
            <span className="text-orange-600 font-extrabold text-[11px] uppercase tracking-widest">{T(lib.eyebrow)}</span>
            <h2 className="text-xl md:text-3xl font-black text-slate-900 leading-tight">{T(lib.title)}</h2>
          </div>
          <select value={sortBy} onChange={e => setSortBy(e.target.value)} aria-label="Sort"
            className="px-2.5 py-2 rounded-xl border border-orange-200 text-[11px] font-bold text-slate-800 bg-orange-50/40 focus:outline-none focus:border-orange-500">
            <option value="featured">Featured</option><option value="popular">Most Popular</option><option value="newest">Newest</option>
            <option value="price-low">Price ↑</option><option value="price-high">Price ↓</option><option value="discount">Top Discount</option>
          </select>
        </div>
        <div className="relative flex items-center gap-2 mb-2">
          <div className="flex-1 flex items-center gap-2 overflow-x-auto no-scrollbar py-1.5 px-0.5">
            <FBtn id="all" icon="layers" label={L("libAll")} />
            {CATEGORIES.map(c => <FBtn key={c.id} id={c.id} icon={c.icon} label={c.name} />)}
          </div>
          <button onClick={() => setSOpen(true)} aria-label="Search library"
            className={`relative w-10 h-10 shrink-0 rounded-xl border flex items-center justify-center ${query ? "bg-orange-500 text-white border-orange-500" : "bg-white text-slate-700 border-slate-200 hover:bg-orange-50"}`}>
            <Icon name="search" className="w-[18px] h-[18px]" />
            {query && <span className="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-rose-500 border-2 border-white"></span>}
          </button>
          {sOpen && (
            <div className="absolute inset-0 z-10 bg-white flex items-center gap-2 rounded-xl border-2 border-orange-400 px-3 fade-up">
              <Icon name="search" className="w-4 h-4 text-orange-500" />
              <input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder={L("libSearch")} className="flex-1 bg-transparent outline-none text-sm min-w-0" />
              {query && <button onClick={() => setQuery("")} className="text-[11px] font-bold text-slate-400">Clear</button>}
              <button onClick={() => setSOpen(false)} aria-label="Close search" className="text-slate-500"><Icon name="x" className="w-4 h-4" /></button>
            </div>
          )}
        </div>
        <p className="text-[11px] font-bold text-slate-600 mb-3 flex items-center gap-1.5">
          <span className="w-2 h-2 rounded-full bg-orange-500"></span>{activeName} · {list.length} Ebook{list.length !== 1 ? "s" : ""}{query && <span className="text-orange-600"> · “{query}”</span>}
        </p>
        {list.length === 0 ? (
          <div className="text-center py-12 bg-orange-50/50 rounded-2xl border border-dashed border-orange-300">
            <p className="text-slate-600 font-bold text-sm">{L("libEmpty")}</p>
            <button onClick={() => { setQuery(""); setCategory("all"); }} className="mt-3 px-4 py-2 bg-orange-500 text-white text-xs font-bold rounded-xl">{L("libReset")}</button>
          </div>
        ) : (
          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2.5 md:gap-4">{list.map(p => <BookCard key={p.id} p={p} />)}</div>
        )}
      </div>
    </section>
  );
}

/* =====================================================================
   CUSTOM COMBO BUILDER

function ComboSection() {
  const A = useContext(Ctx);
  const [sel, setSel] = useState([]);
  if (!COMBO_ON || PRODUCTS.length < COMBO_MIN) return null;
  const c0 = SITE.combo;
  const chosen = PRODUCTS.filter(p => sel.includes(p.id));
  const regular = sum(chosen, p => p.regularPrice);
  const today = sum(chosen, p => p.salePrice);
  const active = chosen.length >= COMBO_MIN;
  const comboOff = active ? Math.round(today * COMBO_PERCENT / 100) : 0;
  const final = today - comboOff;
  const need = Math.max(0, COMBO_MIN - chosen.length);
  const toggle = id => setSel(s => (s.includes(id) ? s.filter(x => x !== id) : [...s, id]));
  const asItem = () => ({ id: "PENDING", kind: "combo", title: `Custom Combo (${chosen.length} Ebooks)`, ebookIds: chosen.map(p => p.id), regularPrice: regular, todayPrice: today, comboOff });
  return (
    <section id="combos" className="py-10 bg-orange-50/60 border-b border-orange-100">
      <div className="max-w-7xl mx-auto px-3 md:px-4">
        <SectionHead eyebrow={T(c0.eyebrow)} title={T(c0.title)} sub={T(c0.sub)} />
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div className="lg:col-span-7 grid grid-cols-1 sm:grid-cols-2 gap-2.5 content-start">
            {PRODUCTS.map(p => {
              const on = sel.includes(p.id);
              return (
                <button key={p.id} onClick={() => toggle(p.id)} aria-pressed={on}
                  className={`relative p-2.5 rounded-2xl border-2 text-left flex items-center gap-2.5 transition ${on ? "bg-white border-orange-500 shadow-md" : "bg-white/80 border-orange-200 hover:border-orange-400"}`}>
                  <div className="w-11 aspect-[3/4] rounded-md overflow-hidden shrink-0 shadow"><Cover item={p} mini /></div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[9px] font-extrabold text-orange-600">{p.id}</div>
                    <div className="text-[11px] md:text-xs font-extrabold text-slate-900 leading-snug line-clamp-2">{p.title}</div>
                    <div className="mt-0.5 flex items-baseline gap-1.5"><span className="font-black text-orange-600 text-sm">{fmt(p.salePrice)}</span>{p.hasOffer && <span className="text-[10px] text-slate-400 line-through">{fmt(p.regularPrice)}</span>}</div>
                  </div>
                  <span className={`w-6 h-6 rounded-full border-2 flex items-center justify-center shrink-0 ${on ? "bg-orange-500 border-orange-500 text-white" : "border-slate-300 text-transparent"}`}><Icon name="check" className="w-3.5 h-3.5" sw={3.5} /></span>
                </button>
              );
            })}
          </div>
          <div className="lg:col-span-5">
            <div className="lg:sticky lg:top-36 bg-white rounded-3xl border-2 border-orange-300 shadow-lg p-4">
              <h3 className="font-black text-sm text-slate-900 flex items-center gap-2"><Icon name="layers" className="w-4 h-4 text-orange-500" />{L("comboYour")}</h3>
              <div className="mt-3 flex items-center gap-1.5 min-h-[52px] overflow-x-auto no-scrollbar">
                {chosen.length === 0 && <p className="text-xs text-slate-400">{L("comboPick")}</p>}
                {chosen.map(p => <div key={p.id} className="w-10 aspect-[3/4] rounded-md overflow-hidden shrink-0 shadow border border-white"><Cover item={p} mini /></div>)}
              </div>
              <div className="mt-2">
                <div className="flex justify-between text-[11px] font-bold"><span className="text-slate-600">{L("comboChosen", { n: chosen.length, min: COMBO_MIN })}</span><span className={active ? "text-emerald-600" : "text-orange-600"}>{active ? L("comboActive", { percent: COMBO_PERCENT }) : L("comboNeed", { n: need })}</span></div>
                <div className="mt-1 h-1.5 bg-orange-100 rounded-full overflow-hidden"><div className={`h-full rounded-full transition-all ${active ? "bg-emerald-500" : "bg-orange-500"}`} style={{ width: `${Math.min(100, (chosen.length / COMBO_MIN) * 100)}%` }}></div></div>
              </div>
              <div className="mt-3 space-y-1.5 text-xs">
                <div className="flex justify-between text-slate-600"><span>{L("lblRegular")}</span><span className="line-through text-slate-400">{fmt(regular)}</span></div>
                <div className="flex justify-between text-emerald-700 font-bold"><span>{L("lblDiscount")}</span><span>-{fmt(regular - today)}</span></div>
                <div className="flex justify-between text-slate-800 font-bold"><span>{L("lblToday")}</span><span>{fmt(today)}</span></div>
                <div className={`flex justify-between font-bold ${active ? "text-emerald-700" : "text-slate-400"}`}><span>{L("lblCombo")} ({COMBO_PERCENT}%)</span><span>-{fmt(comboOff)}</span></div>
                <div className="pt-2 border-t border-dashed border-orange-200 flex justify-between items-baseline"><span className="font-extrabold text-sm text-slate-900">{L("lblFinal")}</span><span className="text-2xl font-black text-orange-600">{fmt(chosen.length ? final : 0)}</span></div>
                {chosen.length > 0 && <p className="text-right text-[11px] font-extrabold text-emerald-700">{L("comboSaved", { amount: fmt(regular - final) })}</p>}
              </div>
              <div className="mt-3 grid grid-cols-2 gap-2">
                {CART_ON ? (
                  <button disabled={!active} onClick={() => { if (A.addCombo(asItem())) setSel([]); }}
                    className={`py-2.5 rounded-xl font-extrabold text-[11px] flex items-center justify-center gap-1.5 ${active ? "bg-orange-500 hover:bg-orange-600 text-white shadow-md" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}><Icon name="cart" className="w-4 h-4" />{L("addToCart")}</button>
                ) : null}
                <button disabled={!active} onClick={() => A.whatsapp([{ ...asItem(), id: "SNC-NEW" }])}
                  className={`${CART_ON ? "" : "col-span-2 "}py-2.5 rounded-xl font-extrabold text-[11px] flex items-center justify-center gap-1.5 ${active ? "bg-emerald-500 hover:bg-emerald-600 text-white shadow-md" : "bg-slate-100 text-slate-400 cursor-not-allowed"}`}><Icon name="wa" className="w-4 h-4" />{L("waOrder")}</button>
              </div>
              {!active && <p className="mt-2 text-[10px] text-slate-500 text-center">{L("comboOnly", { min: COMBO_MIN })}</p>}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

            <path d="M24 0H150C166 0 168 8 173 17C181 32 190 40 200 40C210 40 219 32 227 17C232 8 234 0 250 0H376Q400 0 400 24V40Q400 64 376 64H24Q0 64 0 40V24Q0 0 24 0Z" fill="#fff" stroke="#FED7AA" strokeWidth="1" />
          </svg>
          <div className="relative z-10 grid grid-cols-5 h-full items-center px-1">
            <Item k="home" icon="home" label={L("navHome")} color="#F97316" onClick={() => { setOpen(false); A.goSection("hero"); }} />
            <Item k="ebooks" icon="book" label={L("navEbooks")} color="#3B82F6" onClick={() => { setOpen(false); A.goSection("explore"); }} />
            <div className="flex flex-col items-center justify-end h-full pb-1.5"><span className={`text-[9px] font-extrabold ${open ? "text-orange-600" : "text-slate-500"}`}>{L("navMenu")}</span></div>

          </div>
          <div className="absolute left-1/2 -top-6 w-14 h-14 -translate-x-1/2 z-20">

          <div className={`grid gap-2.5 ${{ 1: "grid-cols-1", 2: "grid-cols-2" }[SITE.payment.steps.length] || "grid-cols-3"}`}>
            {SITE.payment.steps.map((s, i) => (
              <div key={s.id || i} className="bg-orange-50 border border-orange-200 rounded-2xl p-3 text-center">
                <div className="w-10 h-10 mx-auto rounded-xl bg-orange-500 text-white flex items-center justify-center"><Icon name={s.icon || "card"} className="w-5 h-5" /></div>
                <div className="text-[11px] font-extrabold text-slate-900 mt-2 leading-tight">{T(s.title, { productId: p.id }, "keep")}</div>
                {s.text && <div className="text-[10px] text-slate-500 mt-0.5">{T(s.text, { productId: p.id }, "keep")}</div>}
              </div>
            ))}
          </div>
        </section>
      )}

      {/* SUGGESTED */}
      {more.length > 0 && (
        <section className="max-w-5xl mx-auto px-3 mt-7">
          <h3 className="font-black text-lg text-slate-900 mb-3">{L("ppSuggested")}</h3>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2.5 md:gap-4">{more.map(m => <BookCard key={m.id} p={m} />)}</div>
        </section>
      )}

      {/* FAQ + DISCLAIMER */}
      {(faqs.length > 0 || SITE.product.disclaimer) && (
        <section className="max-w-3xl mx-auto px-3 mt-8">
          {faqs.length > 0 && <>
            <h3 className="font-black text-lg text-slate-900 mb-3 text-center">{T(SITE.faq.productTitle)}</h3>
            <Faq items={faqs} />
          </>}
          {SITE.product.disclaimer && <p className="mt-4 text-[10px] text-slate-500 text-center leading-relaxed">{SITE.product.disclaimer}</p>}
        </section>
      )}

      {/* STICKY CTA */}
      <div className="fixed bottom-0 left-0 right-0 z-40 bg-white border-t-2 border-orange-300 shadow-[0_-8px_24px_rgba(249,115,22,.18)]" style={{ paddingBottom: "env(safe-area-inset-bottom)" }}>
        <div className="max-w-3xl mx-auto px-3 pt-2 pb-2.5">
          <div className="flex items-center justify-between text-[11px] font-extrabold mb-1.5">
            <span><span className="text-orange-600 text-base font-black">{fmt(p.salePrice)}</span>{d > 0 && <> <span className="text-slate-400 line-through font-semibold">{fmt(p.regularPrice)}</span> <span className="text-rose-600">-{d}%</span></>}</span>
            {(t || hasLeft) && <span className="text-orange-700 flex items-center gap-1">{t && <><Icon name="clock" className="w-3 h-3" /><span className="tabular">{t.text}</span></>}{t && hasLeft && " • "}{hasLeft && L("ppLeftShort", { n: p.copiesLeft })}</span>}
          </div>
          <div className={`grid gap-2 ${{ 1: "grid-cols-1", 2: "grid-cols-2" }[nBtn] || "grid-cols-3"}`}>
            {CART_ON && (st === "in"
              ? <button onClick={A.openCart} className="py-2.5 rounded-xl bg-orange-50 border-2 border-orange-500 text-orange-600 font-extrabold text-[11px] flex items-center justify-center gap-1"><Icon name="check" className="w-4 h-4" sw={3} />{L("inCart")}</button>
              : <button onClick={() => A.add(p)} disabled={st === "covered"} className={`py-2.5 rounded-xl font-extrabold text-[11px] flex items-center justify-center gap-1 ${st === "covered" ? "bg-slate-100 text-slate-400" : "bg-orange-500 text-white shadow-md shadow-orange-200"}`}><Icon name="cart" className="w-4 h-4" />{st === "covered" ? L("ppCovered") : L("ppCartShort")}</button>)}
            {canPay && <button onClick={() => A.payItem(p)} className="py-2.5 rounded-xl bg-slate-900 text-amber-300 font-extrabold text-[11px] flex items-center justify-center gap-1"><Icon name="card" className="w-4 h-4" />{SITE.payment.ctaShort}</button>}
            <button onClick={() => A.whatsapp(list)} className="py-2.5 rounded-xl bg-emerald-500 text-white font-extrabold text-[11px] flex items-center justify-center gap-1"><Icon name="wa" className="w-4 h-4" />WhatsApp</button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* =====================================================================
   APP
   ===================================================================== */
const SECTION_VIEW = { hero: HeroSection, trust: TrustStrip, goals: GoalsSection, library: LibrarySection, combo: ComboSection, bundles: BundlesSection, reviews: ReviewsSection, steps: ProcessSection, chat: ChatSection, faq: FaqSection, about: AuthorSection, finalcta: FinalCta };
const NAV_MAP = { hero: "home", explore: "ebooks", combos: "offers", bundles: "offers" };

function setMeta(attr, key, value) {
  try {
    let el = document.head.querySelector(`meta[${attr}="${key}"]`);
    if (!value) { if (el) el.setAttribute("content", ""); return; }
    if (!el) { el = document.createElement("meta"); el.setAttribute(attr, key); document.head.appendChild(el); }
    el.setAttribute("content", value);
  } catch (e) {}
}
function applySeo() {
  try {
    const s = SITE.seo, v = VARS;
    const title = SN.fill(s.title, v, "keep") || SITE.store.name;
    const desc = SN.fill(s.description, v, "keep");
    document.title = title;
    setMeta("name", "description", desc);
    setMeta("name", "keywords", s.keywords);
    setMeta("property", "og:title", SN.fill(s.ogTitle, v, "keep") || title);
    setMeta("property", "og:description", SN.fill(s.ogDescription, v, "keep") || desc);
    setMeta("property", "og:type", "website");
    setMeta("property", "og:site_name", SITE.store.name);
    const abs = p => { const x = SAFE_IMG(p); if (!x) return ""; try { return new URL(x, location.href).href; } catch (e) { return x; } };
    const og = abs(s.ogImage);
    setMeta("property", "og:image", og); setMeta("name", "twitter:image", og);
    setMeta("name", "twitter:card", og ? "summary_large_image" : "summary");
    const fav = abs(s.favicon) || abs(SITE.store.logo);
    if (fav) { let l = document.head.querySelector('link[rel="icon"]'); if (!l) { l = document.createElement("link"); l.rel = "icon"; document.head.appendChild(l); } l.href = fav; l.removeAttribute("type"); }
  } catch (e) {}
}
function copyToClipboard(txt) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).catch(() => legacyCopy(txt)); return true; } } catch (e) {}
  return legacyCopy(txt);
}
function legacyCopy(txt) {
  try { const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:-1000px;opacity:0"; document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok; } catch (e) { return false; }
}

function App({ rev }) {
  const [tick, setTick] = useState(0);
  // हरेक render मा नवीनतम data (वर्तमान समय अनुसार Offer सक्रिय/समाप्त) बनाउने
  useMemo(() => { rebuild(Date.now()); return 0; }, [rev, tick]);
  const [route, setRoute] = useState(parseHash);
  const [cart, setCart] = useState(() => lsGet("sn_cart", []).map(refreshItem).filter(Boolean));
  const [cartOpen, setCartOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [category, setCategory] = useState("all");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("featured");
  const [preview, setPreview] = useState(null);
  const [policy, setPolicy] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);
  const [activeSec, setActiveSec] = useState("hero");
  const homeY = useRef(0);
  const pending = useRef(null);
  const toastT = useRef(null);

  useEffect(() => { const i = setInterval(() => setTick(t => t + 1), 30000); return () => clearInterval(i); }, []);
  useEffect(() => { // Offer समाप्त हुने क्षणमा Price फेरि हिसाब गर्ने
    const end = RT && RT.nearestEnd; if (!end) return;
    const ms = end - Date.now() + 700; if (ms <= 0 || ms > 2147000000) return;
    const t = setTimeout(() => setTick(x => x + 1), ms); return () => clearTimeout(t);
  }, [rev, tick]);
  useEffect(() => { // Cart को Price/Item हालको catalog सँग मिलाउने
    setCart(prev => { const next = prev.map(refreshItem).filter(Boolean); return JSON.stringify(next) === JSON.stringify(prev) ? prev : next; });
  }, [rev, tick]);
  useEffect(() => { applySeo(); }, [rev]);
  useEffect(() => { if (!PREVIEW) lsSet("sn_cart", cart); }, [cart]);
  useEffect(() => { const h = () => setRoute(parseHash()); window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);
  useEffect(() => { setRoute(parseHash()); }, [rev]);
  useEffect(() => {
    if (route.page === "product") { window.scrollTo(0, 0); return; }
    const t = setTimeout(() => {
      if (pending.current) { const el = document.getElementById(pending.current); pending.current = null; if (el) el.scrollIntoView({ behavior: "smooth" }); }
      else window.scrollTo(0, homeY.current);
    }, 60);
    return () => clearTimeout(t);
  }, [route.page, route.id]);
  useEffect(() => {
    if (route.page !== "home") return;
    const ids = ["hero", "explore", "combos", "bundles", "reviews"];
    const onScroll = () => {
      const y = window.scrollY + 170; let cur = "hero";
      ids.forEach(id => { const el = document.getElementById(id); if (el && el.offsetTop <= y) cur = id; });
      setActiveSec(cur);
    };
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [route.page]);

  const toast = msg => { setToastMsg(msg); clearTimeout(toastT.current); toastT.current = setTimeout(() => setToastMsg(null), 3200); };
  const setHash = h => { try { window.location.hash = h; } catch (e) { setRoute(parseHash()); } };
  const openProduct = id => { if (!PBYID[id]) return; homeY.current = route.page === "home" ? window.scrollY : homeY.current; setHash("#/p/" + id); };
  const goHome = () => { if (route.page === "home") window.scrollTo({ top: 0, behavior: "smooth" }); else { homeY.current = 0; setHash("#/"); } };
  const goSection = id => {
    if (route.page === "home") { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: "smooth" }); else window.scrollTo({ top: 0, behavior: "smooth" }); }
    else { pending.current = id; setHash("#/"); }
  };

  const covered = useMemo(() => new Set(cart.flatMap(i => i.ebookIds)), [cart]);
  const status = item => {
    if (cart.some(c => c.id === item.id)) return "in";
    if (item.kind === "ebook" && covered.has(item.id)) return "covered";
    return "none";
  };
  const totals = useMemo(() => calcTotals(cart), [cart, rev, tick]);

  // duplicate/overlap रोक्ने र Combo/Bundle ले single ebook replace गर्ने
  const commit = (newItem, silent) => {
    if (!CART_ON) return false;
    if (cart.some(c => c.id === newItem.id)) { setCartOpen(true); return false; }
    const blockers = cart.filter(c => c.kind !== "ebook" && c.ebookIds.some(e => newItem.ebookIds.includes(e)));
    if (blockers.length) { toast(L("toastBlocked", { title: blockers[0].title })); return false; }
    const replaced = cart.filter(c => c.kind === "ebook" && newItem.ebookIds.includes(c.id));
    setCart(prev => [...prev.filter(c => !(c.kind === "ebook" && newItem.ebookIds.includes(c.id))), newItem]);
    if (!silent) toast(replaced.length && newItem.kind !== "ebook" ? L("toastReplaced", { id: newItem.id, n: replaced.length }) : L("toastAdded", { id: newItem.id }));
    return true;
  };
  const add = item => commit(toCartItem(item));
  const addCombo = c => {
    const n = lsGet("sn_combo_seq", 0) + 1;
    const ok = commit({ ...c, id: "SNC" + pad(n, 3) });
    if (ok) lsSet("sn_combo_seq", n);
    return ok;
  };
  const remove = id => { setCart(prev => prev.filter(i => i.id !== id)); toast(L("toastRemoved")); };

  // बाहिरी link: user click को तुरुन्तै (synchronous) खोल्ने — Popup block नहोस् भनेर
  const open = url => {
    if (PREVIEW) { toast("Preview मा बाहिरी link खुल्दैन: " + url.slice(0, 60)); return; }
    let w = null;
    try { w = window.open(url, "_blank", "noopener"); } catch (e) {}
    if (!w) { try { window.location.href = url; } catch (e) {} }
  };
  const whatsappText = txt => { if (!SITE.contact.whatsapp) { toast(L("toastNoWa")); return; } open(`https://wa.me/${SITE.contact.whatsapp}?text=${encodeURIComponent(txt)}`); };
  const whatsapp = list => whatsappText(list && list.length ? buildOrderText(list) : T(SITE.contact.contactMessage, {}, "keep"));
  const copyOrder = list => { copyToClipboard(buildOrderText(list)); toast(L("toastCopied")); };
  const pay = list => {
    if (!SN.safeUrl(BRAND.nspayUrl)) { toast(L("toastNoNspay")); return; }
    copyToClipboard(buildOrderText(list));
    toast(T(SITE.payment.copiedToast, {}, "keep") || L("toastCopied"));
    open(BRAND.nspayUrl);
  };
  const payItem = item => { if (CART_ON && status(item) === "none") commit(toCartItem(item), true); pay([toCartItem(item)]); };
  const runAction = a => {
    const x = SN.parseAction(a);
    if (x.type === "section") goSection(SN.SECTION_TARGETS[x.value] || x.value);
    else if (x.type === "product") { if (PBYID[x.value]) openProduct(x.value); else goSection(BYID[x.value] ? "bundles" : "explore"); }
    else if (x.type === "cart") { if (CART_ON) setCartOpen(true); else goSection("explore"); }
    else if (x.type === "whatsapp") whatsapp(null);
    else if (x.type === "nspay") { if (SN.safeUrl(BRAND.nspayUrl)) open(BRAND.nspayUrl); else toast(L("toastNoNspay")); }
    else if (x.type === "url") { const u = SN.safeUrl(x.value); if (u) open(u); }
  };

  const activeNav = NAV_MAP[activeSec] || null;
  const ctx = {
    route, cart, cartOpen, openCart: () => setCartOpen(true), closeCart: () => setCartOpen(false), totals, tick, rev,
    searchOpen, setSearchOpen, category, setCategory, query, setQuery, sortBy, setSortBy,
    preview, setPreview, policy, setPolicy, status, add, addCombo, remove,
    openProduct, goHome, goSection, runAction, whatsapp, whatsappText, pay, payItem, copyOrder, activeNav, toast
  };
  const order = SITE.sections.filter(s => s.enabled && SECTION_VIEW[s.id]).map(s => s.id);
  const showTop = secOn("announcement");
  const noProducts = PRODUCTS.length === 0;

  return (
    <Ctx.Provider value={ctx}>
      <div className="min-h-screen flex flex-col">
        <div className="sticky top-0 z-40 shadow-sm">{showTop && <TopBars />}<Header /></div>
        {toastMsg && <div className="fixed top-[118px] left-1/2 z-[70] w-[92%] max-w-md toast-in" style={{ transform: "translateX(-50%)" }}><div className="bg-slate-900 text-white px-4 py-2.5 rounded-2xl shadow-2xl border border-orange-400/40 flex items-center gap-2 text-xs font-bold"><Icon name="checkc" className="w-4 h-4 text-emerald-400 shrink-0" /><span>{toastMsg}</span></div></div>}
        <main className="flex-grow">
          {route.page === "product" && PBYID[route.id] ? <ProductPage key={route.id + ":" + rev} p={PBYID[route.id]} /> : noProducts ? (
            <section className="py-24 px-4 text-center"><div className="max-w-md mx-auto"><div className="w-16 h-16 mx-auto rounded-full bg-orange-100 text-orange-500 flex items-center justify-center"><Icon name="book" className="w-8 h-8" /></div><p className="mt-4 text-sm font-bold text-slate-700">{L("emptyStore")}</p>{SITE.contact.whatsapp && <button onClick={() => whatsapp(null)} className="mt-4 px-5 py-2.5 rounded-xl bg-emerald-500 text-white font-extrabold text-xs inline-flex items-center gap-2"><Icon name="wa" className="w-4 h-4" />WhatsApp</button>}</div></section>
          ) : (
            <>{order.map(id => { const V = SECTION_VIEW[id]; return <V key={id} />; })}</>
          )}
        </main>
        {route.page === "home" && secOn("footer") && <Footer />}
        {route.page === "home" && !noProducts && <BottomNav />}
        <SearchOverlay />
        <CartDrawer />
        <PreviewModal />
        <PolicyModal />
      </div>
    </Ctx.Provider>
  );
}

/* =====================================================================
   BOOT — data/products.json + data/store-settings.json (GitHub Pages) → render
   ===================================================================== */
function Boot() {
  const [rev, setRev] = useState(0);
  const [state, setState] = useState("loading");
  const load = () => {
    setState("loading");
    const bust = "?v=" + Date.now();
    const getJson = url => fetch(url + bust, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(url + " " + r.status); return r.json(); });
    getJson("data/products.json")
      .then(cat => getJson("data/store-settings.json").catch(() => ({})).then(set => {
        RAW = { catalog: cat && typeof cat === "object" ? cat : { products: [] }, settings: set && typeof set === "object" ? set : {} };
        rebuild(Date.now());
        setRev(r => r + 1); setState("ready");
      }))
      .catch(() => setState("error"));
  };
  useEffect(() => {
    if (!PREVIEW) { load(); return; }
    // Admin Preview: Admin ले postMessage बाट draft data पठाउँछ (Publish नगरी हेर्न)
    const onMsg = ev => {
      if (ev.origin !== location.origin || !ev.data || ev.data.type !== "sn-preview-data") return;
      RAW = { catalog: ev.data.catalog || { products: [] }, settings: ev.data.settings || {} };
      rebuild(Date.now()); setRev(r => r + 1); setState("ready");
    };
    window.addEventListener("message", onMsg);
    try { window.parent.postMessage({ type: "sn-preview-ready" }, location.origin); } catch (e) {}
    return () => window.removeEventListener("message", onMsg);
  }, []);
  useEffect(() => {
    if (state !== "ready" && state !== "error") return;
    if (window.__snReady) window.__snReady();
  }, [state]);
  if (state === "ready") return <App rev={rev} />;
  if (state === "error") {
    const retry = (SITE && SITE.labels && SITE.labels.loadRetry) || SN.DEFAULTS.labels.loadRetry;
    return <div className="min-h-screen flex items-center justify-center p-6 text-center"><div className="max-w-sm"><p className="text-sm font-bold text-slate-700">{SN.DEFAULTS.labels.loadFail}</p><button onClick={load} className="mt-4 px-5 py-2.5 bg-orange-500 text-white font-extrabold text-xs rounded-xl">{retry}</button></div></div>;
  }
  return <div className="min-h-screen flex items-center justify-center"><div className="w-10 h-10 rounded-full border-4 border-orange-200 border-t-orange-500 animate-spin"></div></div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Boot />);

</script>
